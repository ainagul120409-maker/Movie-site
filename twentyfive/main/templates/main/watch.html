<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{{ movie.name }}</title>

    <style>
        body {
            background: #000;
            color: white;
            text-align: center;
            font-family: Arial;
            padding: 40px;
        }

        h1 {
            color: #e50914;
        }

        .video {
            margin: 30px auto;
            width: 80%;
            height: 500px;
            background: #111;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
    </style>

</head>


<body>


    <h1>{{ movie.name }}</h1>


    <div class="video">

        🎬 Здесь будет плеер фильма

    </div>


    <a href=" {% url 'detail' movie.id %}">
        Назад к фильму/
    </a>

    <a class="back" href="{% url 'index' %}">
        На главную
    </a>


</body>

</html>
