<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Мой профиль</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #141414;
            color: white;

            min-height: 100vh;

            padding: 25px;
        }


        /* ВЕРХНЯЯ ПАНЕЛЬ */

        .top-bar {

            max-width: 900px;

            margin: 0 auto 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        /* СТРЕЛКА НАЗАД */

        .back-button {

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #222;

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            transition: .3s;
        }


        .back-button:hover {

            background: #e50914;

            transform: translateX(-3px);
        }


        /* ВЫХОД */

        .logout-button {

            padding: 10px 18px;

            border-radius: 8px;

            background: #e50914;

            color: white;

            text-decoration: none;

            transition: .3s;
        }


        .logout-button:hover {

            background: #ff2631;
        }


        /* ПРОФИЛЬ */

        .profile {

            max-width: 900px;

            margin: 0 auto;

            background: #222;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, .6);
        }


        /* ВЕРХ ПРОФИЛЯ */

        .profile-header {

            display: flex;

            align-items: center;

            gap: 30px;

            padding-bottom: 30px;

            border-bottom: 1px solid #333;
        }


        /* АВАТАР */

        .avatar-container {

            position: relative;

            width: 150px;
            height: 150px;

            flex-shrink: 0;
        }


        .avatar {

            width: 150px;
            height: 150px;

            background: #e50914;

            border-radius: 50%;

            overflow: hidden;

            border: 4px solid #333;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;
        }


        .avatar img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* КНОПКА + */

        .avatar-plus {

            position: absolute;

            right: 0;
            bottom: 5px;

            width: 45px;
            height: 45px;

            border-radius: 50%;

            background: #e50914;

            border: 4px solid #222;

            color: white;

            font-size: 28px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition: .3s;
        }


        .avatar-plus:hover {

            background: #ff2631;

            transform: scale(1.1);
        }


        /* ФОРМА */

        .avatar-form input {

            display: none;
        }


        /* ИМЯ */

        .profile-title h1 {

            color: white;

            font-size: 36px;

            margin-bottom: 10px;
        }


        .profile-title p {

            color: #aaa;

            font-size: 18px;
        }


        /* ИНФОРМАЦИЯ */

        .info {

            margin-top: 30px;

            background: #181818;

            padding: 25px;

            border-radius: 12px;
        }


        .info-title {

            font-size: 24px;

            margin-bottom: 20px;

            color: #e50914;
        }


        .info p {

            margin-bottom: 15px;

            color: #ccc;

            font-size: 18px;
        }


        .info p:last-child {

            margin-bottom: 0;
        }


        .info strong {

            color: white;
        }


        /* АДАПТАЦИЯ ДЛЯ ТЕЛЕФОНА */

        @media (max-width: 600px) {

            body {

                padding: 15px;
            }


            .profile {

                padding: 25px;
            }


            .profile-header {

                flex-direction: column;

                text-align: center;
            }


            .profile-title h1 {

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->

    <div class="top-bar">


        <!-- НАЗАД -->

        <a
            href="{% url 'index' %}"
            class="back-button"
            title="На главную"
        >
            ←
        </a>


        <!-- ВЫЙТИ -->

        <a
            href="{% url 'logout' %}"
            class="logout-button"
        >
            Выйти
        </a>


    </div>



    <!-- ПРОФИЛЬ -->

    <div class="profile">


        <!-- ВЕРХ ПРОФИЛЯ -->

        <div class="profile-header">


            <!-- АВАТАР -->

            <div class="avatar-container">


                <div class="avatar">

                    {% if profile.avatar %}

                        <img
                            src="{{ profile.avatar.url }}"
                            alt="Аватар {{ user.username }}"
                        >

                    {% else %}

                        👤

                    {% endif %}

                </div>


                <!-- КНОПКА + -->

                <form
                    method="POST"
                    enctype="multipart/form-data"
                    class="avatar-form"
                >

                    {% csrf_token %}


                    <label
                        for="avatar-input"
                        class="avatar-plus"
                        title="Добавить фотографию"
                    >
                        +
                    </label>


                    <input
                        id="avatar-input"
                        type="file"
                        name="avatar"
                        accept="image/*"
                        onchange="this.form.submit()"
                    >

                </form>


            </div>



            <!-- ИНФОРМАЦИЯ О ПОЛЬЗОВАТЕЛЕ -->

            <div class="profile-title">

                <h1>
                    {{ user.username }}
                </h1>

                <p>
                    Мой профиль
                </p>

            </div>


        </div>



        <!-- ИНФОРМАЦИЯ -->

        <div class="info">

            <div class="info-title">
                Информация
            </div>


            <p>

                👤 Пользователь:

                <strong>
                    {{ user.username }}
                </strong>

            </p>


            <p>

                📧 Email:

                <strong>
                    {{ user.email }}
                </strong>

            </p>


            <p>

                📅 Дата регистрации:

                <strong>
                    {{ user.date_joined|date:"d.m.Y" }}
                </strong>

            </p>

        </div>


    </div>


</body>

</html>
