<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Вход</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #141414;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;

            background: #222;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.6);
        }

        h1 {
            text-align: center;

            color: #e50914;

            margin-bottom: 30px;
        }

        .input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            background: #333;

            border: none;

            border-radius: 8px;

            color: white;

            font-size: 16px;
        }

        .input:focus {
            outline: 2px solid #e50914;
        }

        .button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #e50914;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .button:hover {
            background: #ff2631;
        }

        .error {
            background: #7d1515;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;
        }

        .link:hover {
            color: white;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🎬 Вход</h1>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input
                class="input"
                type="text"
                name="username"
                placeholder="Имя пользователя"
                required
            >

            <input
                class="input"
                type="password"
                name="password"
                placeholder="Пароль"
                required
            >

            <button
                class="button"
                type="submit"
            >
                Войти
            </button>

        </form>

        <a
            class="link"
            href="{% url 'register' %}"
        >
            Нет аккаунта? Зарегистрироваться
        </a>

    </div>

</body>

</html>
